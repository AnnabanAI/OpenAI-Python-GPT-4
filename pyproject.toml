[tool.poetry]
name = "annabanai-governance-gateway"
version = "0.1.0"
description = "Provider-neutral human-governed AI gateway and tamper-evident audit chain"
authors = ["Jacob Wayne Kinnaird"]
packages = [{ include = "annabanai_gateway" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
annabanai-gateway = "annabanai_gateway.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
