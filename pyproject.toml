[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annabanai-governance-gateway"
version = "0.1.0"
description = "Provider-neutral human-governed AI gateway and tamper-evident audit chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary until the repository owner selects a license" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
annabanai-gateway = "annabanai_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["annabanai_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
